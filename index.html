<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Actualizaciones para Agente IA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: #ffffff; /* fondo blanco */
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #212529;
        }

        /* eliminado body::before (gráficos de fondo) */

        .container {
            max-width: 700px;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #0d6efd;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #0d6efd;
        }

        textarea {
            resize: vertical;
            min-height: 200px;
            border-radius: 10px;
            background: #ffffff;
            border: 1px solid #ced4da;
            color: #212529;
        }

        textarea::placeholder {
            color: #6c757d;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
        }

        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            padding: 10px;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .success { color: #198754; }
        .error { color: #dc3545; }
        .loading { color: #ffc107; }

        .icon-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .icon-header i {
            font-size: 50px;
            color: #0d6efd;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="icon-header">
            <i class="fas fa-robot"></i>
        </div>

        <h1>Actualizar Instrucciones del Agente IA</h1>

        <form id="updateForm">
            <div class="mb-3">
                <label for="instruction" class="form-label">Nueva Instrucción o Actualización</label>
                <textarea class="form-control" id="instruction" placeholder="Escribe la nueva instrucción aquí..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                Enviar Actualización <i class="fas fa-paper-plane ms-2"></i>
            </button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        const form = document.getElementById('updateForm');
        const status = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const instruction = document.getElementById('instruction').value.trim();

            if (!instruction) {
                status.textContent = 'Por favor, ingresa una instrucción.';
                status.className = 'error';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Enviando... <i class="fas fa-spinner fa-spin ms-2"></i>';
            status.textContent = 'Procesando...';
            status.className = 'loading';

            const webhookUrl = 'https://dr-jorge-aso-n8n.pmsak1.easypanel.host/webhook-test/8dab3752-43d0-4618-a387-5e38ad96c935';

            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ update: instruction }),
                });

                if (response.ok) {
                    status.textContent = '¡Actualización enviada exitosamente!';
                    status.className = 'success';
                    form.reset();
                } else {
                    status.textContent = 'Error al enviar la actualización.';
                    status.className = 'error';
                }
            } catch (error) {
                status.textContent = 'Error de conexión.';
                status.className = 'error';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Enviar Actualización <i class="fas fa-paper-plane ms-2"></i>';
            }
        });
    </script>

</body>
</html>
