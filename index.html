<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Actualizaciones para Agente IA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        .container {
            max-width: 700px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                        0 0 20px rgba(13, 110, 253, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(13, 110, 253, 0.5);
        }

        h1 {
            text-align: center;
            color: #0d6efd; /* COLOR SUAVIZADO */
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            margin-bottom: 30px;
            position: relative;
            text-shadow: 0 0 6px rgba(13, 110, 253, 0.4);
        }

        h1::after {
            content: '';
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #0d6efd, #6ea8fe);
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 6px rgba(13, 110, 253, 0.5);
        }

        .form-label {
            font-weight: 600;
            color: #0d6efd;
            text-shadow: 0 0 4px rgba(13, 110, 253, 0.4);
        }

        textarea {
            resize: vertical;
            min-height: 200px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(13, 110, 253, 0.5);
            color: #ffffff;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            background: linear-gradient(90deg, #0d6efd 0%, #6ea8fe 100%);
            border: none;
        }

        .icon-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .icon-header i {
            font-size: 50px;
            color: #0d6efd; /* COLOR SUAVIZADO */
            text-shadow: 0 0 8px rgba(13, 110, 253, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="icon-header">
            <i class="fas fa-robot"></i>
        </div>

        <h1>Actualizar Instrucciones del Agente IA</h1>

        <form id="updateForm">
            <div class="mb-3">
                <label for="instruction" class="form-label">Nueva Instrucción o Actualización</label>
                <textarea class="form-control" id="instruction" placeholder="Escribe la nueva instrucción aquí..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Enviar Actualización <i class="fas fa-paper-plane ms-2"></i>
            </button>
        </form>
    </div>

</body>
</html>
