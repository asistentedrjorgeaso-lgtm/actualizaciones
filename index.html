<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Actualizaciones para Agente IA</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #212529;
        }

        .container {
            max-width: 700px;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #dee2e6;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .robot {
            text-align: center;
            font-size: 64px;
            margin-bottom: 10px;
        }

        textarea {
            resize: vertical;
            min-height: 200px;
        }

        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: 500;
        }

        .success {
            color: #198754;
        }

        .error {
            color: #dc3545;
        }

        .loading {
            color: #ffc107;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="robot">🤖</div>

    <h1>Actualizar Instrucciones del Agente IA</h1>

    <form id="updateForm">
        <div class="mb-3">
            <label for="instruction" class="form-label">
                Nueva instrucción o actualización
            </label>
            <textarea
                class="form-control"
                id="instruction"
                placeholder="Escribe la nueva instrucción aquí..."
                required
            ></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100" id="submitBtn">
            Enviar actualización
        </button>
    </form>

    <div id="status"></div>
</div>

<script>
const form = document.getElementById('updateForm');
const status = document.getElementById('status');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const instruction = document.getElementById('instruction').value.trim();

    if (!instruction) {
        status.textContent = 'Por favor, ingresa una instrucción.';
        status.className = 'error';
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';
    status.textContent = 'Procesando...';
    status.className = 'loading';

    const webhookUrl = 'https://dr-jorge-aso-n8n.pmsak1.easypanel.host/webhook-test/8dab3752-43d0-4618-a387-5e38ad96c935';

    try {
        const response = await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ update: instruction }),
        });

        if (response.ok) {
            status.textContent = '¡Actualización enviada correctamente!';
            status.className = 'success';
            form.reset();
        } else {
            status.textContent = 'Error al enviar la actualización.';
            status.className = 'error';
        }
    } catch (err) {
        status.textContent = 'Error de conexión con el servidor.';
        status.className = 'error';
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar actualización';
    }
});
</script>

</body>
</html>
